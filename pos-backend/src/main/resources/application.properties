server.port=${SERVER_PORT:5000}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==========================================================
# CẤU HÌNH SENDGRID SMTP (HOẠT ĐỘNG Ở CẢ LOCAL & PRODUCTION)
# Lưu ý: Trên SendGrid, username cố định là "apikey", password là API Key (SG.xxx)
# ==========================================================
spring.mail.host=${MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:apikey}
spring.mail.password=${MAIL_PASSWORD:abcd}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Địa chỉ email người gửi đã xác thực (Single Sender Verification / Domain Auth) trên SendGrid
app.mail.from=${MAIL_FROM:posfrom@yopmail.com}
app.mail.from-name=${MAIL_FROM_NAME:posfrom}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.ai.gemini-api-key=${GEMINI_API_KEY:}
app.ai.gemini-model=${GEMINI_MODEL:gemini-2.5-flash}

app.backend-url=${APP_BACKEND_URL:}
app.upload-dir=${APP_UPLOAD_DIR:uploads}
